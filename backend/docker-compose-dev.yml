version: "3.9"

services:
  api:
    build: .
    container_name: controlplane_api
    ports:
      - "8100:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/controlplane
      MAINTENANCE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/maintenance_db
      REDIS_URL: redis://redis:6379/0
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_PUBLIC_ENDPOINT_URL: http://localhost:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - controlplane

  db:
    image: postgres:16-alpine
    container_name: controlplane_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: controlplane
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - controlplane

  pgadmin:
    image: dpage/pgadmin4
    container_name: controlplane_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - controlplane

  redis:
    image: redis:7-alpine
    container_name: controlplane_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - controlplane

  minio:
    image: minio/minio:latest
    container_name: controlplane_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - controlplane

  # Creates the default MinIO bucket on first start
  minio_init:
    image: minio/mc:latest
    container_name: controlplane_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/controlplane &&
        mc anonymous set download local/controlplane
      "
    networks:
      - controlplane

  prometheus:
    image: prom/prometheus:latest
    container_name: controlplane_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9091:9090"
    depends_on:
      - api
    networks:
      - controlplane

  grafana:
    image: grafana/grafana:latest
    container_name: controlplane_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - controlplane

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  controlplane:
    driver: bridge
