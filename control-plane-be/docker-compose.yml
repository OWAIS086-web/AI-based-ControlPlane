version: "3.9"

services:
  nginx:
    image: nginx:alpine
    container_name: controlplane_nginx
    ports:
      - "${NGINX_PORT:-10001}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_build:/usr/share/nginx/html
    depends_on:
      - api
      - frontend
    networks:
      - controlplane
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME}/controlplane-frontend:latest
    container_name: controlplane_frontend
    volumes:
      - frontend_build:/usr/share/nginx/html
    networks:
      - controlplane

  api:
    image: ${DOCKERHUB_USERNAME}/controlplane-api:latest
    container_name: controlplane_api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - controlplane
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: controlplane_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - controlplane
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: controlplane_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - controlplane
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: controlplane_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DATA_DIR:-./data}/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - controlplane
    restart: unless-stopped

  minio_init:
    image: minio/mc:latest
    container_name: controlplane_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
        mc mb --ignore-existing local/${AWS_BUCKET_NAME} &&
        mc anonymous set download local/${AWS_BUCKET_NAME}
      "
    networks:
      - controlplane

  pgadmin:
    image: dpage/pgadmin4
    container_name: controlplane_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5051:80"
    depends_on:
      - db
    networks:
      - controlplane
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: controlplane_prometheus
    user: "65534:65534"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${DATA_DIR:-./data}/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9091:9090"
    depends_on:
      - api
    networks:
      - controlplane
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: controlplane_grafana
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ${DATA_DIR:-./data}/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    networks:
      - controlplane
    restart: unless-stopped

volumes:
  # Persistent data now lives in bind mounts under ${DATA_DIR:-./data}.
  # frontend_build stays a named volume: deploys delete and recreate it on purpose.
  frontend_build:

networks:
  controlplane:
    driver: bridge