
name: Build & Push Backend
on:
  push:
    tags: [ "v*" ]

jobs:
  build-and-push:
    runs-on:
      group: copilot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.tag }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/controlplane-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/controlplane-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/controlplane-api:${{ steps.version.outputs.tag }}

      - name: Print version for deploy
        run: echo "Version => ${{ steps.version.outputs.tag }}"
